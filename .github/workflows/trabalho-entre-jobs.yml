name: Vendo arquivos compartilhados entre jobs

on:
  push:
    branches:
      - main

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versao do Ubuntu
        run: cat /etc/os-release
      
      - name: Exibir uma mensagem
        run: echo "Estou fazendo o curso de Github Actions da Linuxtips" > mensagem.txt

      - uses: actions/upload-artifact@v7
        with:
          name: strigus
          path: /home/ubuntu/mensagem.txt


  job_2:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar o conteudo do diretorio
        run: ls-lha

      - uses: actions/download-artifact@v8
        with:
          name: strigus
          path: mensagem.txt

      - name: Verificar o conteudo do diretorio
        run: ls-lha && ./strigus/

      - name: Acessa arquivo mensagem
        run: mv strigus/mensagem.txt . && rm -rf ./strigus

      - name: Verificar o conteudo do diretorio
        run: ls-lha

      - name: Acessa arquivo mensagem
        run: cat mensagem.txt
