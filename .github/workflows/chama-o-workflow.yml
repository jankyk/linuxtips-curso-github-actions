name: Chama o workflow call

on:
  workflow_dispatch:
    inputs:
      nome-do-curso-enviado:
        required: true
        type: string

jobs:
  chama-workflow:
    uses: ./.github/workflows/trigger-workflow-call.yml
    with:
      nome-do-curso-recebido: ${{ github.events.inputs.nome-do-curso-enviado }}